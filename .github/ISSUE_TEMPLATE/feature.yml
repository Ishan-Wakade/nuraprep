name: Feature proposal
description: Propose a focused product or engineering improvement.
title: "feat: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who experiences this problem, and what evidence shows it matters?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe success without prescribing unnecessary technology.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
  - type: textarea
    id: risks
    attributes:
      label: Risks and tradeoffs
      description: Consider educational accuracy, accessibility, privacy, security, cost, and maintainability.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This keeps the current Math-first roadmap or explains why the roadmap should change.
          required: true
        - label: This proposal does not depend on copied or protected exam content.
          required: true
