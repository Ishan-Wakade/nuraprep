name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      DATABASE_URL: postgresql://nuraprep:nuraprep@localhost:5432/nuraprep
      DIRECT_URL: postgresql://nuraprep:nuraprep@localhost:5432/nuraprep
      E2E_DATABASE_URL: postgresql://nuraprep:nuraprep@localhost:5432/nuraprep_e2e
      BETTER_AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
      DEV_REVIEWER_ENABLED: true
      DEV_LEARNER_ENABLED: true

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nuraprep
          POSTGRES_PASSWORD: nuraprep
          POSTGRES_USER: nuraprep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nuraprep -d nuraprep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Validate database migrations
        run: pnpm db:migrate

      - name: Run database smoke test
        run: pnpm test:db

      - name: Seed development review fixtures
        run: pnpm db:seed

      - name: Run unit tests
        run: pnpm test

      - name: Build production application
        run: pnpm build

      - name: Build production container
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_APP_URL=http://localhost:3100
          --target runner
          --tag nuraprep:ci .

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e
